version: 2

models:

  # =========================
  # SILVER
  # =========================

  - name: stg_registrations
    description: "{{ doc('registration_definition') }}"

    config:
      contract:
        enforced: true
      on_schema_change: fail  

    columns:
      - name: registration_id
        description: "Unique registration identifier."
        data_type: string
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: "Patient first name."
        data_type: string

      - name: last_name
        description: "Patient last name."
        data_type: string

      - name: date_of_birth
        description: "Patient date of birth."
        data_type: date

      - name: gender
        description: "Patient gender."
        data_type: string

      - name: city
        description: "Patient city."
        data_type: string

      - name: registration_date
        description: "Date and time of patient registration."
        data_type: timestamp

      - name: status
        description: "Registration status."
        data_type: string
        data_tests:
            - accepted_values:
                arguments:
                  values: ['Active', 'Inactive']        

      - name: created_at
        description: "Record creation timestamp."
        data_type: timestamp

      - name: updated_at
        description: "Record update timestamp."
        data_type: timestamp  
        data_tests:
            - updated_at_not_before_created_at:
                arguments:
                  created_column: created_at
                config:
                  severity: error
                  warn_if: "> 0"
                  error_if: "> 2"
                  
  - name: stg_encounters
    description: "Silver encounter records."
    columns:
      - name: encounter_id
        description: "Unique encounter identifier."
        data_tests:
          - not_null
          - unique
      - name: registration_id
        description: "Registration associated with the encounter."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_registrations')
              field: registration_id
      - name: doctor_id
        description: "Doctor associated with the encounter."
        data_tests:
          - relationships:
              to: ref('stg_doctors')
              field: doctor_id
      - name: department_id
        description: "Department associated with the encounter."
        data_tests:
          - relationships:
              to: ref('stg_departments')
              field: department_id
      - name: encounter_type
        description: "Type of hospital encounter."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Emergency', 'Follow-up', 'OPD']

      - name: status
        description: "Encounter status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Completed']    

      - name: updated_at
        description: "Last update timestamp."
        data_tests:
          - updated_at_not_before_created_at:
              arguments:
                created_column: created_at

  - name: stg_admissions
    description: "Silver admission records."
    columns:
      - name: admission_id
        description: "Unique admission identifier."
        data_tests:
          - not_null
          - unique
      - name: registration_id
        description: "Registration associated with the admission."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_registrations')
              field: registration_id
      - name: encounter_id
        description: "Encounter associated with the admission."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_encounters')
              field: encounter_id
      - name: doctor_id
        description: "Doctor associated with the admission."
        data_tests:
          - relationships:
              to: ref('stg_doctors')
              field: doctor_id
      - name: department_id
        description: "Department associated with the admission."
        data_tests:
          - relationships:
              to: ref('stg_departments')
              field: department_id

      - name: updated_at
        description: "Last update timestamp."
        data_tests:
          - updated_at_not_before_created_at:
              arguments:
                created_column: created_at

  - name: stg_discharges
    description: "Silver discharge records."
    columns:
      - name: discharge_id
        description: "Unique discharge identifier."
        data_tests:
          - not_null
          - unique
      - name: admission_id
        description: "Admission associated with the discharge."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_admissions')
              field: admission_id
      - name: registration_id
        description: "Registration associated with the discharge."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_registrations')
              field: registration_id

      - name: updated_at
        description: "Last update timestamp."
        data_tests:
          - updated_at_not_before_created_at:
              arguments:
                created_column: created_at

  - name: stg_billing
    description: "Silver billing records."
    columns:
      - name: bill_id
        description: "Unique bill identifier."
        data_tests:
          - not_null
          - unique
      - name: registration_id
        description: "Registration associated with the bill."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_registrations')
              field: registration_id
      - name: encounter_id
        description: "Encounter associated with the bill, when applicable."
        data_tests:
          - relationships:
              to: ref('stg_encounters')
              field: encounter_id
      - name: admission_id
        description: "Admission associated with the bill, when applicable."
        data_tests:
          - relationships:
              to: ref('stg_admissions')
              field: admission_id
      - name: discharge_id
        description: "Discharge associated with the bill, when applicable."
        data_tests:
          - relationships:
              to: ref('stg_discharges')
              field: discharge_id

      - name: updated_at
        description: "Last update timestamp."
        data_tests:
          - updated_at_not_before_created_at:
              arguments:
                created_column: created_at

  - name: stg_doctors
    description: "Silver doctor master records."
    columns:
      - name: doctor_id
        description: "Unique doctor identifier."
        data_tests:
          - not_null
          - unique

      - name: updated_at
        description: "Last update timestamp."
        data_tests:
          - updated_at_not_before_created_at:
              arguments:
                created_column: created_at

  - name: stg_departments
    description: "Silver department master records."
    columns:
      - name: department_id
        description: "Unique department identifier."
        data_tests:
          - not_null
          - unique

      - name: updated_at
        description: "Last update timestamp."
        data_tests:
          - updated_at_not_before_created_at:
              arguments:
                created_column: created_at

  # =========================
  # GOLD
  # =========================

  - name: patient_360
    description: "Patient-level analytical summary based on registration records."
    columns:
      - name: registration_id
        description: "Registration/patient identifier."
        data_tests:
          - not_null
          - unique

  - name: encounter_summary
    description: "Encounter-level analytical summary enriched with doctor and department."
    columns:
      - name: encounter_id
        description: "Unique encounter identifier."
        data_tests:
          - not_null
          - unique

  - name: billing_summary
    description: "Registration-level billing summary."
    columns:
      - name: registration_id
        description: "Registration/patient identifier."
        data_tests:
          - not_null
          - unique
